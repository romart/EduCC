name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's results uninteresting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite as a developer runs it: the fixture suites, the IR dumps, the
  # cross-backend link and the structural checkers, twice over - once per host
  # compiler, since the compiler this project builds is itself C and has been
  # kept building under both.
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      # Zydis is fetched as a hash-pinned tarball into .deps/, outside the build
      # tree, so it survives the build directory being thrown away - cache it on
      # the same key so an upstream outage does not take the whole workflow with
      # it.
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/Zydis.cmake') }}

      - name: Configure
        run: cmake -B build -S . -DCMAKE_C_COMPILER=${{ matrix.cc }}

      - name: Build
        run: cmake --build build -j$(nproc)

      # The codegen fixtures link and run the result, so this needs a real
      # toolchain on the runner rather than only a compiler - which
      # ubuntu-latest has, and which is also why the runner has to stay
      # x86_64: what these fixtures compile to is what the runner executes.
      # riscv64 is not a second runner but the job below, through qemu.
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit "$GITHUB_WORKSPACE/results-${{ matrix.cc }}.xml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.cc }}
          path: results-${{ matrix.cc }}.xml
          if-no-files-found: ignore

  # The compiler compiling itself, and then the whole suite run by the result.
  # This is the job that earns its runtime: a self-compiled compiler is the
  # largest and least forgiving input EduCC has, and seven of this tree's
  # shipped bugs were found this way and by nothing else.
  selfhost:
    name: self-host and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/Zydis.cmake') }}

      # Builds stage 0 with gcc, stage 1 and 2 with EduCC, checks the two EduCC
      # stages are byte-identical, and runs ctest with stage 2.
      - name: Bootstrap and run the suite with the result
        run: ./selfhost.sh

  # The other machine (roadmap step 59). Not a second runner: riscv64 is a
  # cross sysroot and an emulator on this one, which is what lets the same
  # fixtures be compiled for it and *run*.
  #
  # Its own job rather than packages added to 'test' above, because installing
  # a cross toolchain in both matrix legs would pay for it twice to answer a
  # question neither leg asks - which host compiler built EduCC has nothing to
  # do with which machine EduCC targets.
  riscv64:
    name: riscv64 (cross suites and self-host)
    runs-on: ubuntu-latest
    # The longest job here by some way, and all of it emulation: the self-host
    # alone runs 37 suite entries with a riscv64-hosted compiler under qemu.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/Zydis.cmake') }}

      # gcc for the ABI oracle and for building the vendored Zydis in the
      # cross build; binutils for objdump, which emission_objdump.py compares
      # the emitted bytes against; the cross libc for something to link
      # against; qemu-user to run what comes out.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross qemu-user

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build -j$(nproc)

      # Everything with riscv64 in its name, which is exactly the entries the
      # suites above cannot register without this toolchain: the codegen
      # corpus compiled for riscv64 and run under qemu, the cross-toolchain
      # ABI differential, the machine-IR baselines, and the structural
      # checkers' second target.
      - name: Run the riscv64 suites
        run: ctest --test-dir build --output-on-failure -R riscv64

      # And the question the corpus cannot ask: EduCC compiling itself for
      # riscv64, stage 2 built by stage 1 under qemu, the two byte-identical.
      # It found both of the bugs R8 found and the corpus did not. Stage 2
      # then runs 37 of the suite's entries - it was 7 before R6 taught the
      # structural checkers the target.
      - name: Self-host for riscv64
        run: ./selfhost.sh --target riscv64

  # The compiler is an arena allocator over a memory-mapped source buffer, so
  # nothing it gets wrong about a lifetime shows up as a crash near the mistake.
  # Several bugs in this tree were silent until a sanitized binary ran the same
  # input, which is the whole argument for a job that only recompiles inputs the
  # jobs above have already compiled.
  asan:
    name: AddressSanitizer sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/Zydis.cmake') }}

      - name: Configure
        run: cmake -B build-asan -S . -DEDUCC_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      # Every fixture and every one of EduCC's own sources, through both
      # backends. Needs .deps to have been populated, which the configure step
      # above has done: the sources include Zydis' header.
      - name: Sweep
        run: test/asan_sweep.sh build-asan/bin/main
